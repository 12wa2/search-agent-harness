name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: pip wheel . --no-deps --no-cache-dir --wheel-dir dist
      - name: Verify packaged web console
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "search_agent/web/index.html",
              "search_agent/web/styles.css",
              "search_agent/web/app.js",
          }
          missing = required - names
          assert not missing, f"wheel is missing web assets: {sorted(missing)}"
          PY
      - name: Offline demo smoke test
        run: search-agent demo --top-k 5

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ablation gate (compare against docs/eval_baseline.json)
        run: search-agent eval --generated 120 --seed 7 --ablate --baseline docs/eval_baseline.json

  es-integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,es]"
      - name: Integration tests (real Elasticsearch)
        run: pytest -q -m es
