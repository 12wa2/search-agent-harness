services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: search-agent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  api:
    build: .
    image: search-agent-harness:local
    container_name: search-agent-api
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SEARCH_AGENT_ES_URL=http://elasticsearch:9200
      - SEARCH_AGENT_ES_INDEX=search-agent-demo
      # - SEARCH_AGENT_API_KEY=sk-...    # uncomment for a real LLM instead of the demo
    ports:
      - "8000:8000"
    restart: unless-stopped

  gateway:
    build: .
    image: search-agent-harness:local
    container_name: search-agent-gateway
    command: ["search-agent", "gateway", "--config", "/app/gateway.docker.json", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      - SEARCH_AGENT_GATEWAY_API_KEY=${SEARCH_AGENT_GATEWAY_API_KEY:-local-gateway-key}
      - PRIMARY_LLM_API_KEY=${PRIMARY_LLM_API_KEY:-}
      - FALLBACK_LLM_API_KEY=${FALLBACK_LLM_API_KEY:-}
    volumes:
      - ./examples/gateway.docker.json:/app/gateway.docker.json:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
