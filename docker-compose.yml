services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: search-agent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  api:
    build: .
    image: search-agent-harness:local
    container_name: search-agent-api
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SEARCH_AGENT_ES_URL=http://elasticsearch:9200
      - SEARCH_AGENT_ES_INDEX=search-agent-demo
      # - SEARCH_AGENT_API_KEY=sk-...    # uncomment for a real LLM instead of the demo
    ports:
      - "8000:8000"
    restart: unless-stopped
