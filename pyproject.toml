[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-agent-harness"
version = "0.1.0"
description = "An eight-stage reflective retrieval agent for talent search: intent IR, budget-governed reasoning loop, degradation matrix, and an offline zero-key demo."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "llm", "agentic-search", "retrieval", "harness", "recruiting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
redis = ["redis>=5.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "ruff>=0.9", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
search-agent = "search_agent.cli:main"

[project.urls]
Homepage = "https://github.com/12wa2/search-agent-harness"
Repository = "https://github.com/12wa2/search-agent-harness"
Issues = "https://github.com/12wa2/search-agent-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/search_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
 "src/search_agent/llm/prompts/__init__.py" = ["E501"]
 "src/search_agent/server.py" = ["B008"]
