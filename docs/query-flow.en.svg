<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1080' viewBox='0 0 1600 1080' role='img' aria-labelledby='title desc' lang='en'>
<title id='title'>One Query, End to End</title>
<desc id='desc'>Search Agent Harness query flow overview: from a hiring request through routing, governed Agent execution, SearchTool and Hybrid V2 retrieval, to an evidence-backed candidate list.</desc>
<defs>
<style type='text/css'><![CDATA[
text { font-family: Aptos, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
svg { fill: #26342e; }
.mono { font-family: 'Cascadia Mono', Consolas, monospace; }
.kicker { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 9.8px; font-weight: 650; fill: #2a7663; letter-spacing: 1.5px; }
.h1 { font-size: 40px; font-weight: 650; fill: #17251f; }
.sub { font-size: 15.2px; fill: #5b6761; }
.legend { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 8.3px; font-weight: 500; fill: #5d6963; }
.nNum { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 10px; font-weight: 650; fill: #2a7663; letter-spacing: .8px; }
.nTitle { font-size: 17px; font-weight: 650; fill: #1d2b25; }
.nSub { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 9.4px; font-weight: 500; fill: #4f5b55; }
.nMono { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 8.7px; font-weight: 500; fill: #55625b; }
.crossText { font-size: 8.2px; }
.sideTitle { font-size: 12.5px; font-weight: 650; fill: #26342e; }
.sideBody { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 8.8px; font-weight: 500; fill: #4f5b55; }
.label { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 7.9px; font-weight: 700; fill: #236d5b; letter-spacing: .9px; }
.center { text-anchor: middle; }
.end { text-anchor: end; }
.node { fill: #fcfbf7; stroke: #c8d1ca; stroke-width: 1.2; }
.nodeMain { fill: #f8fbf8; stroke: #7ca393; stroke-width: 1.3; }
.nodeLLM { fill: #fbf4ef; stroke: #d3a08a; stroke-width: 1.2; }
.nodeTool { fill: #f6faf7; stroke: #8eb2a5; stroke-width: 1.2; }
.nodeFinal { fill: #fbf6e9; stroke: #c3ad72; stroke-width: 1.2; }
.side { fill: #fbfaf6; stroke: #d4dad4; stroke-width: 1; }
.lineMain { stroke: #7d968c; stroke-width: 1.4; fill: none; }
.hairline { stroke: #d9ded9; stroke-width: 1; }
.chip rect { fill: #f4f7f3; stroke: #c8d1ca; stroke-width: 1; }
.chip text { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 8.2px; font-weight: 650; fill: #24332d; text-anchor: middle; }
.chip.llm rect { fill: #faf1eb; stroke: #d3a08a; }
.chip.llm text { fill: #9a4f32; }
.chip.tool rect { fill: #eef7f2; stroke: #8eb2a5; }
.chip.tool text { fill: #226b57; }
.chip.rule rect { fill: #eff5f8; stroke: #9ab5c5; }
.chip.rule text { fill: #356983; }
.tag { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 7.5px; font-weight: 700; letter-spacing: .5px; }
]]></style>
<pattern id='dotGrid' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='.9' fill='#d7d1c4' opacity='.55'/></pattern>
<marker id='arrow' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#7d968c'/></marker>
<marker id='arrowMint' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#2a7663'/></marker>
<marker id='arrowOrange' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#b65f3a'/></marker>
</defs>
<rect width='1600' height='1080' fill='#f6f3ec'/>
<rect width='1600' height='1080' fill='url(#dotGrid)'/>
<rect x='64' y='42' width='30' height='4' rx='2' fill='#b65f3a'/>
<text x='64' y='69' class='kicker'>SEARCH AGENT HARNESS / QUERY FLOW · OVERVIEW</text>
<text x='64' y='111' class='h1'>One Query, End to End</text>
<text x='64' y='140' class='sub'>From a hiring request to an evidence-backed shortlist; the seven nodes that matter.</text>
<text x='1132' y='70' class='label'>LEGEND</text>
<line x1='1132' y1='87' x2='1168' y2='87' class='lineMain' marker-end='url(#arrow)'/>
<text x='1178' y='90' class='legend'>Main path</text>
<line x1='1244' y1='87' x2='1280' y2='87' stroke='#b65f3a' stroke-width='1.2' stroke-dasharray='4 4' marker-end='url(#arrowOrange)'/>
<text x='1290' y='90' class='legend'>Branch / feedback</text>
<circle cx='1392' cy='87' r='3.6' fill='#b65f3a'/>
<text x='1402' y='90' class='legend'>LLM</text>
<circle cx='1450' cy='87' r='3.6' fill='#2a7663'/>
<text x='1460' y='90' class='legend'>Tool / evidence</text>
<line x1='64' y1='166' x2='1536' y2='166' class='hairline'/>

<!-- main spine -->
<circle cx='800' cy='194' r='3.6' fill='#2a7663'/>
<text x='812' y='197' class='nMono'>START</text>
<path d='M 800 200 V 216' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='216' width='480' height='60' rx='4' class='nodeTool'/>
<text x='580' y='240' class='nNum'>01</text>
<text x='612' y='241' class='nTitle'>User Query</text>
<text x='580' y='259' class='nSub'>Natural language: role · skills · tenure · city · preferences</text>
<text x='1020' y='241' class='tag end' fill='#2a7663'>INPUT</text>
<path d='M 800 276 V 294' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='294' width='480' height='60' rx='4' class='nodeMain'/>
<text x='580' y='318' class='nNum'>02</text>
<text x='612' y='319' class='nTitle'>Web Console + FastAPI</text>
<text x='580' y='337' class='nSub'>Agent experience · execution view · session restore · REST + SSE</text>
<text x='1020' y='319' class='tag end' fill='#4e7f9a'>HTTP</text>
<path d='M 800 354 V 372' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='372' width='480' height='68' rx='4' class='nodeMain'/>
<text x='580' y='396' class='nNum'>03</text>
<text x='612' y='397' class='nTitle'>Intent &amp; Entry Router</text>
<text x='580' y='416' class='nSub'>IntentRouter → EntryRouter: split first, then choose a search route</text>
<text x='1020' y='397' class='tag end' fill='#356983'>RULE</text>
<path d='M 800 440 V 458' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='458' width='480' height='104' rx='4' class='nodeLLM'/>
<text x='580' y='482' class='nNum'>04</text>
<text x='612' y='483' class='nTitle'>Governed Agent Loop</text>
<text x='580' y='503' class='nSub'>3 / 5 / 8 adaptive routes · budgets · dedupe · degradation · cancellation</text>
<text x='580' y='524' class='nMono'>understand → plan → execute → judge → evaluate</text>
<text x='580' y='540' class='nMono'>→ reflect → revise → finalize</text>
<text x='1020' y='483' class='tag end' fill='#b65f3a'>LLM + TOOL</text>
<path d='M 800 562 V 580' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='580' width='480' height='66' rx='4' class='nodeTool'/>
<text x='580' y='604' class='nNum'>05</text>
<text x='612' y='605' class='nTitle'>SearchTool</text>
<text x='580' y='624' class='nSub'>search_with_intent()  ·  rerank_pool()</text>
<text x='1020' y='605' class='tag end' fill='#2a7663'>PROTOCOL</text>
<path d='M 800 646 V 664' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='664' width='480' height='90' rx='4' class='nodeTool'/>
<text x='580' y='688' class='nNum'>06</text>
<text x='612' y='689' class='nTitle'>Hybrid V2 Retrieval</text>
<text x='580' y='709' class='nSub'>NL → IR · hard filters · BM25 + kNN · RRF / rerank</text>
<text x='580' y='727' class='nSub'>Every result returns hardMatches plus source evidence</text>
<text x='1020' y='689' class='tag end' fill='#2a7663'>ES 8</text>
<path d='M 800 754 V 772' class='lineMain' marker-end='url(#arrow)'/>
<rect x='560' y='772' width='480' height='82' rx='4' class='nodeFinal'/>
<text x='580' y='796' class='nNum'>07</text>
<text x='612' y='797' class='nTitle'>Candidate list + evidence</text>
<text x='580' y='817' class='nSub'>score · hardMatches · sourceId · highlight · traceId</text>
<text x='580' y='834' class='nSub'>Next: shortlist · compare · view profile · follow up</text>
<text x='1020' y='797' class='tag end' fill='#a58136'>OUTPUT</text>

<!-- router branch -->
<path d='M 1040 406 H 1100' stroke='#b65f3a' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='1100' y='356' width='400' height='146' rx='4' class='side'/>
<text x='1120' y='382' class='sideTitle'>Route branching</text>
<g class='chip rule' transform='translate(1120,396)'><rect width='44' height='20' rx='3'/><text x='22' y='14'>reply</text></g>
<text x='1174' y='410' class='sideBody'>greeting / help / off-topic → terminal reply</text>
<g class='chip tool' transform='translate(1120,422)'><rect width='92' height='20' rx='3'/><text x='46' y='14'>direct_search</text></g>
<text x='1222' y='436' class='sideBody'>explicit structured constraints → skip Agent loop</text>
<g class='chip llm' transform='translate(1120,448)'><rect width='50' height='20' rx='3'/><text x='25' y='14'>agent</text></g>
<text x='1180' y='462' class='sideBody'>needs judgment or exploration → enter 3 / 5 / 8</text>
<text x='1120' y='488' class='nMono'>reply never calls an LLM or SearchTool.</text>

<!-- agent loop -->
<path d='M 500 510 H 560' stroke='#b65f3a' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='100' y='448' width='400' height='120' rx='4' class='side'/>
<text x='120' y='474' class='sideTitle'>For complex requests</text>
<text x='120' y='497' class='sideBody'>evaluate → reflect → revise → plan</text>
<path d='M 372 503 C 372 518, 196 518, 196 503' stroke='#b65f3a' stroke-width='1.1' stroke-dasharray='3 4' fill='none' marker-end='url(#arrowOrange)'/>
<text x='282' y='528' class='nMono center'>Next round · only within budget</text>
<text x='120' y='548' class='sideBody'>Target reached or budget exhausted → finalize.</text>
<text x='120' y='563' class='nMono'>light 5 stages · reflective 8 stages</text>

<!-- LLM gateway -->
<path d='M 1040 520 H 1100' stroke='#b65f3a' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='1100' y='520' width='400' height='98' rx='4' class='side'/>
<text x='1120' y='546' class='sideTitle'>LLM Gateway</text>
<text x='1120' y='566' class='sideBody'>openai-compatible · primary → fallback</text>
<g class='chip llm' transform='translate(1120,578)'><rect width='64' height='20' rx='3'/><text x='32' y='14'>understand</text></g>
<g class='chip llm' transform='translate(1190,578)'><rect width='40' height='20' rx='3'/><text x='20' y='14'>plan</text></g>
<g class='chip llm' transform='translate(1236,578)'><rect width='40' height='20' rx='3'/><text x='20' y='14'>judge</text></g>
<g class='chip llm' transform='translate(1282,578)'><rect width='48' height='20' rx='3'/><text x='24' y='14'>reflect</text></g>
<g class='chip llm' transform='translate(1336,578)'><rect width='54' height='20' rx='3'/><text x='27' y='14'>finalize</text></g>
<text x='1120' y='610' class='nMono'>structured JSON · usage / latency accounted</text>

<!-- fact boundary -->
<path d='M 500 625 H 560' stroke='#2a7663' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='100' y='578' width='400' height='94' rx='4' class='side'/>
<text x='120' y='604' class='sideTitle'>Boundary of truth</text>
<text x='120' y='624' class='sideBody'>LLM decides; candidate facts come from SearchTool.</text>
<text x='120' y='642' class='sideBody'>hardMatches / resume snapshots are never model-written.</text>
<text x='120' y='660' class='nMono'>Swap the retrieval backend = swap one implementation.</text>

<!-- evidence -->
<path d='M 1040 706 H 1100' stroke='#2a7663' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='1100' y='660' width='400' height='110' rx='4' class='side'/>
<text x='1120' y='686' class='sideTitle'>Evidence travels with results</text>
<text x='1120' y='706' class='sideBody'>sourceType · sourceId · chunkId</text>
<text x='1120' y='722' class='sideBody'>score · title · highlight · traceId</text>
<g class='chip tool' transform='translate(1120,734)'><rect width='104' height='20' rx='3'/><text x='52' y='14'>hardMatches</text></g>
<text x='1234' y='748' class='nMono'>Every claim points back to raw fields</text>

<!-- delivery actions -->
<path d='M 500 812 H 560' stroke='#b65f3a' stroke-width='1' stroke-dasharray='3 4' fill='none'/>
<rect x='100' y='760' width='400' height='110' rx='4' class='side'/>
<text x='120' y='786' class='sideTitle'>Delivery is not the end</text>
<text x='120' y='806' class='sideBody'>shortlist · compare · view profile · follow up</text>
<text x='120' y='824' class='sideBody'>Context is reused within a session; pages read snapshots.</text>
<text x='120' y='842' class='nMono'>view and compare do not trigger retrieval</text>
<!-- cross-cutting -->
<path d='M 800 854 V 900' stroke='#7d968c' stroke-width='1.1' stroke-dasharray='4 5' fill='none' marker-end='url(#arrow)'/>
<text x='812' y='879' class='nMono'>events / state</text>
<rect x='64' y='900' width='1472' height='60' rx='4' class='side'/>
<rect x='84' y='918' width='3' height='24' rx='1.5' fill='#b65f3a'/>
<text x='100' y='930' class='label'>CROSS-CUTTING</text>
<text x='100' y='947' class='nMono'>Run context spans the whole path</text>
<text x='404' y='927' class='mono' font-size='9' font-weight='650' fill='#26342e'>Sessions</text>
<text x='404' y='945' class='nMono crossText'>L1 / L2 / L3 · Redis or in-process fallback</text>
<text x='684' y='927' class='mono' font-size='9' font-weight='650' fill='#26342e'>Observability</text>
<text x='684' y='945' class='nMono crossText'>SSE stage events · agentTrace · metrics</text>
<text x='964' y='927' class='mono' font-size='9' font-weight='650' fill='#26342e'>Governance</text>
<text x='964' y='945' class='nMono crossText'>budgets · signature dedupe · degradation · cancellation</text>
<text x='1244' y='927' class='mono' font-size='9' font-weight='650' fill='#26342e'>Evaluation</text>
<text x='1244' y='945' class='nMono crossText'>A/B · baseline · confidence interval</text>
<text x='64' y='1002' class='mono' font-size='9.2' fill='#65716b'>Retrieval is the base; policy is the Agent. Every decision has evidence; every run can be replayed.</text>
<text x='1536' y='1002' class='mono end' font-size='8.1' font-weight='500' fill='#65716b'>search-agent-harness · architecture overview</text>
</svg>
